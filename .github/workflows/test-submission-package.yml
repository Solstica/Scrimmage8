name: Test submission package on Scrimmage8

on:
  push:
    branches:
      - test/submission-package-scrimmage8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submission-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Scrimmage8 test harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all responsibility branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python3 -m py_compile scripts/build_submission.py

      - name: Assemble canonical final-paper snapshot
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW="$RUNNER_TEMP/scrimmage8-final-preview"
          git worktree add --detach "$PREVIEW" origin/feature/paper-shell
          python3 - "$PREVIEW" <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          root = Path.cwd()
          preview = Path(sys.argv[1])
          cfg = json.loads((root / 'config/project.json').read_text(encoding='utf-8'))
          modules = sorted(
              [m for m in cfg['modules'] if m.get('active', True) and m['key'] != 'paper-shell'],
              key=lambda m: m['merge_order'],
          )
          for m in modules:
              ref = f"origin/{m['branch']}"
              paths = []
              for key in ('path', 'task'):
                  if m.get(key):
                      paths.append(m[key])
              paths.extend(m.get('extra_paths', []))
              for path in dict.fromkeys(paths):
                  probe = subprocess.run(
                      ['git', 'cat-file', '-e', f'{ref}:{path}'], cwd=root,
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  )
                  if probe.returncode != 0:
                      print(f'[compose][WARN] {ref} has no {path}; skip')
                      continue
                  subprocess.run(['git', 'checkout', ref, '--', path], cwd=preview, check=True)
              print(f"[compose] {m['key']}: {ref}")
          PY
          echo "PREVIEW_ROOT=$PREVIEW" >> "$GITHUB_ENV"
          test -f "$PREVIEW/paper/main.tex"
          test -f "$PREVIEW/modules/80_appendix/paper/appendix.tex"

      - name: Dependency scan on assembled snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_submission.py \
            --project "$PREVIEW_ROOT" \
            --config "$GITHUB_WORKSPACE/config/submission.json" \
            --dry-run | tee submission-dry-run.log

      - name: Install XeLaTeX toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-science \
            fonts-noto-cjk \
            fonts-texgyre \
            fonts-texgyre-math \
            poppler-utils
          fc-cache -f

      - name: Build real submission package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_submission.py \
            --project "$PREVIEW_ROOT" \
            --config "$GITHUB_WORKSPACE/config/submission.json" | tee submission-build.log

      - name: Validate package contents
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$PREVIEW_ROOT/submission.zip"
          STAGING="$PREVIEW_ROOT/submission"
          test -f "$ZIP"
          test -f "$STAGING/final.pdf"
          unzip -Z1 "$ZIP" | tee submission-manifest.txt

          if grep -E '^(docs/|work/|output/|data/raw/|\.github/|\.git/)|(^|/)results/' submission-manifest.txt; then
            echo '[FAIL] excluded repository material leaked into submission.zip'
            exit 1
          fi

          python3 - <<'PY'
          import os, re, zipfile
          from pathlib import Path

          preview = Path(os.environ['PREVIEW_ROOT'])
          z = preview / 'submission.zip'
          staging = preview / 'submission'
          size_mib = z.stat().st_size / (1024 * 1024)
          print(f'[test] submission.zip = {size_mib:.2f} MiB')
          if size_mib > 20.0:
              raise SystemExit('[FAIL] submission.zip exceeds 20 MiB')

          settings = staging / 'paper/settings.tex'
          main = staging / 'paper/main.tex'
          toc_closed = False
          if settings.exists():
              text = settings.read_text(encoding='utf-8', errors='ignore')
              toc_closed = bool(re.search(r'\\showtocfalse\b', text)) and not bool(re.search(r'\\showtoctrue\b', text))
          if not toc_closed and main.exists():
              text = main.read_text(encoding='utf-8', errors='ignore')
              active = [line for line in text.splitlines() if re.match(r'^\s*\\tableofcontents\s*(?:%.*)?$', line)]
              toc_closed = not active
          if not toc_closed:
              raise SystemExit('[FAIL] table of contents is still active in staging copy')

          names = set(zipfile.ZipFile(z).namelist())
          required = {'paper/main.tex', 'final.pdf', 'README.txt'}
          missing = required - names
          if missing:
              raise SystemExit(f'[FAIL] required package files missing: {sorted(missing)}')
          code_files = sorted(name for name in names if name.startswith('modules/') and '/code/' in name and not name.endswith('/.gitkeep'))
          if not code_files:
              raise SystemExit('[FAIL] no module code was packaged')
          print(f'[test] packaged module code files = {len(code_files)}')
          print('[PASS] package structure, TOC state, code inclusion and size checks passed')
          PY

          pdfinfo "$STAGING/final.pdf" | tee submission-pdfinfo.txt

          mkdir -p test-output
          cp "$ZIP" test-output/submission.zip
          cp "$STAGING/final.pdf" test-output/final.pdf
          cp submission-dry-run.log submission-build.log submission-manifest.txt submission-pdfinfo.txt test-output/

      - name: Upload test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrimmage8-submission-package-test
          if-no-files-found: warn
          retention-days: 7
          path: test-output/
